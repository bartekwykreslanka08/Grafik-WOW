<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Podzielnia WOW – Grafik</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --green: #31a66a;
    --green-dark: #248b56;
    --green-light: #eaf8f0;
    --text: #18201c;
    --muted: #737b76;
    --border: #e7ebe8;
    --bg: #f7f9f8;
    --white: #ffffff;
    --danger: #dc4b4b;
    --shadow: 0 8px 30px rgba(0,0,0,.055);
    --radius: 18px;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
}

.header-inner {
    max-width: 1500px;
    margin: auto;
    padding: 16px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 48px;
    height: 48px;
    object-fit: contain;
    border-radius: 12px;
}

.brand h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 750;
}

.brand small {
    color: var(--muted);
}

.container {
    max-width: 1500px;
    margin: auto;
    padding: 22px;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.month-selector {
    display: flex;
    align-items: center;
    gap: 8px;
}

.month-title {
    min-width: 175px;
    text-align: center;
    font-size: 21px;
    font-weight: 750;
}

.icon-btn,
.secondary-btn,
.primary-btn,
.danger-btn {
    border: 0;
    border-radius: 12px;
    padding: 11px 15px;
    transition: .15s ease;
}

.icon-btn,
.secondary-btn {
    background: var(--white);
    border: 1px solid var(--border);
    color: var(--text);
}

.icon-btn:hover,
.secondary-btn:hover {
    background: #f2f5f3;
}

.primary-btn {
    background: var(--green);
    color: white;
    font-weight: 650;
}

.primary-btn:hover {
    background: var(--green-dark);
}

.danger-btn {
    background: #fff1f1;
    color: var(--danger);
}

.cards {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 18px;
    margin-bottom: 20px;
}

.card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
}

.card-title {
    padding: 18px 18px 12px;
    font-weight: 750;
}

.people {
    padding: 0 12px 12px;
}

.person {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 9px;
    border-radius: 12px;
    gap: 10px;
}

.person:hover {
    background: #f6f8f7;
}

.person-name {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
}

.status-dot {
    width: 9px;
    height: 9px;
    background: var(--green);
    border-radius: 50%;
    flex-shrink: 0;
}

.person-name span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.person-actions {
    display: flex;
    gap: 5px;
}

.small-btn {
    border: 0;
    background: transparent;
    padding: 6px 8px;
    border-radius: 8px;
    color: var(--muted);
}

.small-btn:hover {
    background: #eef2ef;
    color: var(--text);
}

.add-person {
    margin: 4px 12px 14px;
    width: calc(100% - 24px);
}

.notice {
    padding: 18px;
    color: var(--muted);
    font-size: 14px;
}

.schedule-wrapper {
    overflow: hidden;
}

.schedule-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

.schedule {
    min-width: 900px;
}

.schedule-head,
.schedule-row {
    display: grid;
    grid-template-columns: 150px repeat(var(--days), minmax(75px, 1fr));
}

.schedule-head {
    border-bottom: 1px solid var(--border);
}

.person-header {
    padding: 12px;
    font-size: 13px;
    color: var(--muted);
    font-weight: 650;
    position: sticky;
    left: 0;
    background: white;
    z-index: 5;
}

.day-head {
    text-align: center;
    padding: 10px 4px;
    border-left: 1px solid var(--border);
    font-size: 12px;
}

.day-number {
    display: block;
    font-size: 16px;
    font-weight: 750;
    margin-top: 2px;
}

.weekend {
    background: #fafbfa;
}

.today {
    background: var(--green-light) !important;
}

.schedule-row {
    border-bottom: 1px solid var(--border);
}

.schedule-row:last-child {
    border-bottom: 0;
}

.person-cell {
    padding: 12px;
    font-weight: 650;
    background: white;
    position: sticky;
    left: 0;
    z-index: 4;
    border-right: 1px solid var(--border);
}

.day-cell {
    min-height: 76px;
    border-left: 1px solid var(--border);
    padding: 7px;
    cursor: pointer;
    transition: .15s;
}

.day-cell:hover {
    background: #f5f8f6;
}

.day-cell.today:hover {
    background: #def4e7 !important;
}

.availability-pill {
    display: block;
    background: var(--green-light);
    color: var(--green-dark);
    border-radius: 9px;
    padding: 7px 5px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 4px;
}

.empty-day {
    color: #c3c9c5;
    font-size: 12px;
    text-align: center;
    margin-top: 18px;
}

.mobile-schedule {
    display: none;
}

.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20,25,22,.38);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 15px;
    z-index: 100;
}

.modal-backdrop.show {
    display: flex;
}

.modal {
    background: white;
    width: min(520px, 100%);
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 22px;
    box-shadow: 0 25px 70px rgba(0,0,0,.18);
}

.modal-header {
    padding: 20px 20px 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
}

.modal-header h2 {
    margin: 0;
    font-size: 19px;
}

.modal-header p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 14px;
}

.close-btn {
    border: 0;
    background: #f1f4f2;
    width: 34px;
    height: 34px;
    border-radius: 50%;
}

.modal-content {
    padding: 15px 20px 20px;
}

.field {
    margin-bottom: 15px;
}

.field label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
}

.field input {
    width: 100%;
    padding: 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
}

.field input:focus {
    border-color: var(--green);
}

.time-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    user-select: none;
    touch-action: none;
}

.time-slot {
    border: 1px solid var(--border);
    background: #fafbfa;
    border-radius: 10px;
    min-height: 45px;
    font-size: 13px;
    font-weight: 600;
    transition: .1s;
}

.time-slot.selected {
    background: var(--green);
    color: white;
    border-color: var(--green);
}

.time-slot:hover {
    border-color: var(--green);
}

.selection-info {
    margin: 13px 0;
    background: var(--green-light);
    color: var(--green-dark);
    padding: 11px;
    border-radius: 11px;
    font-size: 13px;
    text-align: center;
    font-weight: 650;
}

.modal-actions {
    display: flex;
    gap: 9px;
    margin-top: 17px;
}

.modal-actions button {
    flex: 1;
}

.toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(100px);
    background: #17201b;
    color: white;
    padding: 12px 17px;
    border-radius: 12px;
    font-size: 14px;
    z-index: 200;
    opacity: 0;
    transition: .25s;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.loading {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
}

.loading.hidden {
    display: none;
}

.spinner {
    width: 36px;
    height: 36px;
    border: 3px solid #dce9e1;
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.error {
    background: #fff1f1;
    color: #a62e2e;
    border: 1px solid #ffd5d5;
    padding: 13px 16px;
    border-radius: 12px;
    margin-bottom: 15px;
    display: none;
}

@media (max-width: 800px) {
    .header-inner {
        padding: 13px 15px;
    }

    .brand h1 {
        font-size: 17px;
    }

    .brand small {
        font-size: 11px;
    }

    .logo {
        width: 42px;
        height: 42px;
    }

    .container {
        padding: 14px;
    }

    .cards {
        display: block;
    }

    .people-card {
        margin-bottom: 14px;
    }

    .schedule-wrapper {
        display: none;
    }

    .mobile-schedule {
        display: block;
    }

    .mobile-day {
        background: white;
        border: 1px solid var(--border);
        border-radius: 17px;
        margin-bottom: 11px;
        overflow: hidden;
    }

    .mobile-day-header {
        padding: 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .mobile-day-name {
        font-weight: 750;
    }

    .mobile-day-number {
        color: var(--muted);
        font-size: 13px;
    }

    .mobile-person {
        padding: 12px 14px;
        border-bottom: 1px solid #f0f2f1;
        cursor: pointer;
    }

    .mobile-person:last-child {
        border-bottom: 0;
    }

    .mobile-person-name {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .mobile-times {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
    }

    .mobile-time {
        background: var(--green-light);
        color: var(--green-dark);
        padding: 5px 7px;
        border-radius: 7px;
        font-size: 11px;
        font-weight: 700;
    }

    .mobile-empty {
        color: #aab2ad;
        font-size: 12px;
    }

    .month-title {
        min-width: 140px;
        font-size: 18px;
    }

    .topbar {
        align-items: stretch;
    }

    .month-selector {
        width: 100%;
        justify-content: space-between;
    }

    .month-selector button {
        width: 42px;
    }

    .month-title {
        flex: 1;
    }

    .topbar > .secondary-btn {
        width: 100%;
    }

    .time-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 400px) {
    .time-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div class="brand">
            <img src="podzielnialogo.png" class="logo" alt="Podzielnia WOW">
            <div>
                <h1>Podzielnia WOW – Grafik</h1>
                <small>Wspólny grafik dostępności</small>
            </div>
        </div>
    </div>
</header>

<main class="container">

    <div id="error" class="error"></div>

    <div class="topbar">
        <div class="month-selector">
            <button class="icon-btn" id="prevMonth">‹</button>
            <div class="month-title" id="monthTitle"></div>
            <button class="icon-btn" id="nextMonth">›</button>
        </div>

        <button class="secondary-btn" id="todayBtn">
            Dzisiaj
        </button>
    </div>

    <section class="cards">

        <aside class="card people-card">
            <div class="card-title">
                Osoby w grafiku
            </div>

            <button class="primary-btn add-person" id="addPersonBtn">
                + Dodaj siebie do grafiku
            </button>

            <div class="people" id="peopleList"></div>
        </aside>

        <section class="card schedule-wrapper">
            <div class="schedule-scroll">
                <div id="desktopSchedule"></div>
            </div>
        </section>

    </section>

    <section id="mobileSchedule" class="mobile-schedule"></section>

</main>

<!-- MODAL DODAWANIA OSOBY -->

<div class="modal-backdrop" id="personModal">
    <div class="modal">

        <div class="modal-header">
            <div>
                <h2>Dodaj siebie do grafiku</h2>
                <p>Twoje imię będzie widoczne dla wszystkich.</p>
            </div>

            <button class="close-btn" onclick="closeModal('personModal')">
                ×
            </button>
        </div>

        <div class="modal-content">

            <div class="field">
                <label>Jak mam Cię wyświetlać?</label>
                <input
                    id="personName"
                    type="text"
                    maxlength="50"
                    placeholder="np. Bartek K"
                    autocomplete="off"
                >
            </div>

            <button class="primary-btn" style="width:100%" id="savePersonBtn">
                Dodaj mnie
            </button>

        </div>
    </div>
</div>

<!-- MODAL GODZIN -->

<div class="modal-backdrop" id="availabilityModal">

    <div class="modal">

        <div class="modal-header">

            <div>
                <h2 id="availabilityTitle"></h2>
                <p id="availabilitySubtitle"></p>
            </div>

            <button class="close-btn" onclick="closeModal('availabilityModal')">
                ×
            </button>

        </div>

        <div class="modal-content">

            <div class="selection-info" id="selectionInfo">
                Brak zaznaczonej dostępności
            </div>

            <div class="time-grid" id="timeGrid"></div>

            <div class="modal-actions">

                <button class="secondary-btn" id="clearAvailabilityBtn">
                    Wyczyść
                </button>

                <button class="primary-btn" id="saveAvailabilityBtn">
                    Zapisz
                </button>

            </div>

        </div>

    </div>
</div>

<div class="toast" id="toast"></div>

<div class="loading" id="loading">
    <div class="spinner"></div>
</div>

<script>
/* =========================================================
   SUPABASE – WSTAW TUTAJ SWOJE DANE
========================================================= */

const SUPABASE_URL = "TU_WKLEJ_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY = "TU_WKLEJ_SUPABASE_ANON_KEY";

const supabaseConfigured =
    SUPABASE_URL.startsWith("https://") &&
    !SUPABASE_URL.includes("TU_WKLEJ") &&
    SUPABASE_ANON_KEY &&
    !SUPABASE_ANON_KEY.includes("TU_WKLEJ");

let supabaseClient = null;

if (supabaseConfigured) {
    supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );
}

/* =========================================================
   STAN APLIKACJI
========================================================= */

let currentMonth = new Date();
currentMonth.setDate(1);

let users = [];
let availability = [];

let selectedUserId = null;
let selectedDate = null;
let selectedSlots = new Set();

let dragging = false;
let dragStart = null;

/* =========================================================
   GODZINY
========================================================= */

function generateTimeSlots() {
    const result = [];

    for (let hour = 12; hour <= 22; hour++) {

        result.push(
            `${String(hour).padStart(2, "0")}:00`
        );

        if (hour !== 22) {
            result.push(
                `${String(hour).padStart(2, "0")}:30`
            );
        }
    }

    return result;
}

const timeSlots = generateTimeSlots();

/* =========================================================
   DATY
========================================================= */

function dateToString(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");

    return `${y}-${m}-${d}`;
}

function getDaysInMonth(date) {
    return new Date(
        date.getFullYear(),
        date.getMonth() + 1,
        0
    ).getDate();
}

function getDateForDay(day) {
    return new Date(
        currentMonth.getFullYear(),
        currentMonth.getMonth(),
        day
    );
}

function formatMonth(date) {
    return new Intl.DateTimeFormat("pl-PL", {
        month: "long",
        year: "numeric"
    }).format(date);
}

function formatFullDate(date) {
    return new Intl.DateTimeFormat("pl-PL", {
        weekday: "long",
        day: "numeric",
        month: "long"
    }).format(date);
}

function shortWeekday(date) {
    return new Intl.DateTimeFormat("pl-PL", {
        weekday: "short"
    })
    .format(date)
    .replace(".", "")
    .slice(0, 3);
}

/* =========================================================
   LOADING / TOAST
========================================================= */

function setLoading(value) {
    document
        .getElementById("loading")
        .classList.toggle("hidden", !value);
}

function showToast(message) {
    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2200);
}

function showError(message) {
    const error = document.getElementById("error");

    error.textContent = message;
    error.style.display = "block";
}

function hideError() {
    document.getElementById("error").style.display = "none";
}

/* =========================================================
   SUPABASE
========================================================= */

async function loadData() {

    if (!supabaseConfigured) {
        hideLoading();
        showError(
            "Najpierw wpisz Supabase Project URL oraz Supabase Anon/Public Key w kodzie strony."
        );
        render();
        return;
    }

    setLoading(true);
    hideError();

    try {

        const [usersResult, availabilityResult] =
            await Promise.all([

                supabaseClient
                    .from("users")
                    .select("*")
                    .order("created_at", {
                        ascending: true
                    }),

                supabaseClient
                    .from("availability")
                    .select("*")
            ]);

        if (usersResult.error) {
            throw usersResult.error;
        }

        if (availabilityResult.error) {
            throw availabilityResult.error;
        }

        users = usersResult.data || [];
        availability = availabilityResult.data || [];

        render();

    } catch (error) {

        console.error(error);

        showError(
            "Nie udało się pobrać grafiku. Sprawdź połączenie z bazą Supabase."
        );

    } finally {
        setLoading(false);
    }
}

function setupRealtime() {

    if (!supabaseConfigured) return;

    supabaseClient
        .channel("podzielnia-wow-grafik")

        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "users"
            },
            () => {
                loadData();
            }
        )

        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "availability"
            },
            () => {
                loadData();
            }
        )

        .subscribe();
}

/* =========================================================
   RENDER
========================================================= */

function render() {

    document.getElementById("monthTitle").textContent =
        formatMonth(currentMonth);

    renderPeople();
    renderDesktopSchedule();
    renderMobileSchedule();
}

function renderPeople() {

    const list = document.getElementById("peopleList");

    if (!users.length) {
        list.innerHTML = `
            <div class="notice">
                Nikt jeszcze nie dodał siebie do grafiku.
            </div>
        `;
        return;
    }

    list.innerHTML = users.map(user => `
        <div class="person">

            <div class="person-name">
                <span class="status-dot"></span>
                <span>${escapeHtml(user.display_name)}</span>
            </div>

            <div class="person-actions">

                <button
                    class="small-btn"
                    title="Pokaż dostępność"
                    onclick="filterPerson('${user.id}')"
                >
                    👁
                </button>

                <button
                    class="small-btn"
                    title="Usuń osobę"
                    onclick="deletePerson('${user.id}')"
                >
                    ×
                </button>

            </div>

        </div>
    `).join("");
}

function renderDesktopSchedule() {

    const container =
        document.getElementById("desktopSchedule");

    if (!users.length) {
        container.innerHTML = `
            <div class="notice">
                Dodaj pierwszą osobę, aby rozpocząć grafik.
            </div>
        `;
        return;
    }

    const days = getDaysInMonth(currentMonth);

    let html = `
        <div
            class="schedule"
            style="--days:${days}"
        >

        <div class="schedule-head">

            <div class="person-header">
                Osoba
            </div>
    `;

    for (let day = 1; day <= days; day++) {

        const date = getDateForDay(day);
        const weekend =
            date.getDay() === 0 ||
            date.getDay() === 6;

        const today =
            dateToString(date) ===
            dateToString(new Date());

        html += `
            <div class="
                day-head
                ${weekend ? "weekend" : ""}
                ${today ? "today" : ""}
            ">
                ${shortWeekday(date)}
                <span class="day-number">${day}</span>
            </div>
        `;
    }

    html += `</div>`;

    for (const user of users) {

        html += `
            <div class="schedule-row">

                <div class="person-cell">
                    ${escapeHtml(user.display_name)}
                </div>
        `;

        for (let day = 1; day <= days; day++) {

            const date = getDateForDay(day);
            const dateString = dateToString(date);

            const weekend =
                date.getDay() === 0 ||
                date.getDay() === 6;

            const today =
                dateString === dateToString(new Date());

            const entries =
                getUserAvailability(
                    user.id,
                    dateString
                );

            html += `
                <div
                    class="
                        day-cell
                        ${weekend ? "weekend" : ""}
                        ${today ? "today" : ""}
                    "
                    onclick="
                        openAvailability(
                            '${user.id}',
                            '${dateString}'
                        )
                    "
                >
            `;

            if (entries.length) {

                entries.forEach(entry => {

                    html += `
                        <span class="availability-pill">
                            ${entry.start_time.slice(0,5)}
                            –
                            ${entry.end_time.slice(0,5)}
                        </span>
                    `;

                });

            } else {

                html += `
                    <div class="empty-day">
                        —
                    </div>
                `;

            }

            html += `</div>`;
        }

        html += `</div>`;
    }

    html += `</div>`;

    container.innerHTML = html;
}

function renderMobileSchedule() {

    const container =
        document.getElementById("mobileSchedule");

    if (!users.length) {
        container.innerHTML = `
            <div class="card">
                <div class="notice">
                    Dodaj pierwszą osobę, aby rozpocząć grafik.
                </div>
            </div>
        `;
        return;
    }

    const days = getDaysInMonth(currentMonth);

    let html = "";

    for (let day = 1; day <= days; day++) {

        const date = getDateForDay(day);
        const dateString = dateToString(date);

        const today =
            dateString === dateToString(new Date());

        const weekend =
            date.getDay() === 0 ||
            date.getDay() === 6;

        html += `
            <div class="mobile-day">

                <div
                    class="
                        mobile-day-header
                        ${today ? "today" : ""}
                        ${weekend ? "weekend" : ""}
                    "
                >

                    <div class="mobile-day-name">
                        ${shortWeekday(date).toUpperCase()}
                    </div>

                    <div class="mobile-day-number">
                        ${formatFullDate(date)}
                    </div>

                </div>
        `;

        users.forEach(user => {

            const entries =
                getUserAvailability(
                    user.id,
                    dateString
                );

            html += `
                <div
                    class="mobile-person"
                    onclick="
                        openAvailability(
                            '${user.id}',
                            '${dateString}'
                        )
                    "
                >

                    <div class="mobile-person-name">
                        ${escapeHtml(user.display_name)}
                    </div>

                    <div class="mobile-times">
            `;

            if (entries.length) {

                entries.forEach(entry => {

                    html += `
                        <span class="mobile-time">
                            ${entry.start_time.slice(0,5)}
                            –
                            ${entry.end_time.slice(0,5)}
                        </span>
                    `;

                });

            } else {

                html += `
                    <span class="mobile-empty">
                        Brak dostępności
                    </span>
                `;

            }

            html += `
                    </div>
                </div>
            `;
        });

        html += `</div>`;
    }

    container.innerHTML = html;
}

/* =========================================================
   DOSTĘPNOŚĆ
========================================================= */

function getUserAvailability(userId, date) {

    return availability
        .filter(item =>
            item.user_id === userId &&
            item.date === date
        )
        .sort((a,b) =>
            a.start_time.localeCompare(b.start_time)
        );
}

function openAvailability(userId, date) {

    const user = users.find(
        u => u.id === userId
    );

    if (!user) return;

    selectedUserId = userId;
    selectedDate = date;
    selectedSlots = new Set();

    const existing =
        getUserAvailability(userId, date);

    existing.forEach(entry => {

        const start = entry.start_time.slice(0,5);
        const end = entry.end_time.slice(0,5);

        const startIndex =
            timeSlots.indexOf(start);

        const endIndex =
            timeSlots.indexOf(end);

        if (startIndex >= 0 && endIndex >= 0) {

            for (
                let i = startIndex;
                i < endIndex;
                i++
            ) {
                selectedSlots.add(i);
            }
        }
    });

    document.getElementById(
        "availabilityTitle"
    ).textContent =
        user.display_name;

    document.getElementById(
        "availabilitySubtitle"
    ).textContent =
        formatFullDate(
            new Date(date + "T12:00:00")
        );

    renderTimeGrid();

    document
        .getElementById("availabilityModal")
        .classList.add("show");
}

function renderTimeGrid() {

    const grid =
        document.getElementById("timeGrid");

    grid.innerHTML = "";

    timeSlots.forEach((time, index) => {

        const button =
            document.createElement("button");

        button.className =
            "time-slot";

        if (selectedSlots.has(index)) {
            button.classList.add("selected");
        }

        button.textContent = time;

        button.dataset.index = index;

        button.addEventListener(
            "pointerdown",
            startDrag
        );

        button.addEventListener(
            "pointerenter",
            continueDrag
        );

        grid.appendChild(button);
    });

    updateSelectionInfo();
}

function startDrag(event) {

    dragging = true;

    dragStart =
        Number(event.currentTarget.dataset.index);

    toggleRange(dragStart, dragStart);

    document.addEventListener(
        "pointerup",
        stopDrag,
        { once: true }
    );
}

function continueDrag(event) {

    if (!dragging) return;

    const index =
        Number(event.currentTarget.dataset.index);

    toggleRange(dragStart, index);
}

function stopDrag() {

    dragging = false;

    updateSelectionInfo();
}

function toggleRange(start, end) {

    const min = Math.min(start, end);
    const max = Math.max(start, end);

    selectedSlots.clear();

    for (let i = min; i <= max; i++) {
        selectedSlots.add(i);
    }

    renderTimeGrid();
}

function updateSelectionInfo() {

    const info =
        document.getElementById("selectionInfo");

    if (!selectedSlots.size) {
        info.textContent =
            "Brak zaznaczonej dostępności";
        return;
    }

    const indexes =
        [...selectedSlots].sort((a,b) => a-b);

    const start =
        timeSlots[indexes[0]];

    const end =
        timeSlots[indexes[indexes.length - 1] + 1];

    info.textContent =
        `${start} – ${end || "23:00"}`;
}

/* =========================================================
   ZAPIS
========================================================= */

async function saveAvailability() {

    if (!selectedUserId || !selectedDate) return;

    if (!supabaseConfigured) return;

    setLoading(true);

    try {

        await supabaseClient
            .from("availability")
            .delete()
            .eq("user_id", selectedUserId)
            .eq("date", selectedDate);

        if (selectedSlots.size) {

            const indexes =
                [...selectedSlots].sort((a,b) => a-b);

            const ranges = [];

            let start = indexes[0];
            let previous = indexes[0];

            for (let i = 1; i < indexes.length; i++) {

                if (indexes[i] === previous + 1) {
                    previous = indexes[i];
                } else {

                    ranges.push([
                        start,
                        previous + 1
                    ]);

                    start = indexes[i];
                    previous = indexes[i];
                }
            }

            ranges.push([
                start,
                previous + 1
            ]);

            const rows = ranges.map(range => ({

                user_id: selectedUserId,

                date: selectedDate,

                start_time:
                    timeSlots[range[0]],

                end_time:
                    timeSlots[range[1]] || "23:00"

            }));

            const { error } =
                await supabaseClient
                    .from("availability")
                    .insert(rows);

            if (error) throw error;
        }

        closeModal("availabilityModal");

        await loadData();

        showToast("Zapisano");

    } catch (error) {

        console.error(error);

        showError(
            "Nie udało się zapisać dostępności."
        );

    } finally {

        setLoading(false);
    }
}

async function clearAvailability() {

    if (!selectedUserId || !selectedDate) return;

    if (!supabaseConfigured) return;

    setLoading(true);

    try {

        const { error } =
            await supabaseClient
                .from("availability")
                .delete()
                .eq("user_id", selectedUserId)
                .eq("date", selectedDate);

        if (error) throw error;

        selectedSlots.clear();

        closeModal("availabilityModal");

        await loadData();

        showToast("Wyczyszczono");

    } catch (error) {

        console.error(error);

        showError(
            "Nie udało się wyczyścić dostępności."
        );

    } finally {

        setLoading(false);
    }
}

/* =========================================================
   DODAWANIE OSOBY
========================================================= */

async function addPerson() {

    const input =
        document.getElementById("personName");

    const name =
        input.value.trim();

    if (!name) {
        input.focus();
        return;
    }

    if (!supabaseConfigured) {
        showError(
            "Najpierw skonfiguruj Supabase."
        );
        return;
    }

    setLoading(true);

    try {

        const { error } =
            await supabaseClient
                .from("users")
                .insert({
                    display_name: name
                });

        if (error) throw error;

        input.value = "";

        closeModal("personModal");

        await loadData();

        showToast("Dodano do grafiku");

    } catch (error) {

        console.error(error);

        showError(
            "Nie udało się dodać osoby."
        );

    } finally {

        setLoading(false);
    }
}

/* =========================================================
   USUWANIE OSOBY
========================================================= */

async function deletePerson(userId) {

    const user =
        users.find(u => u.id === userId);

    if (!user) return;

    const confirmed =
        confirm(
            `Czy na pewno chcesz usunąć ${user.display_name} z grafiku?`
        );

    if (!confirmed) return;

    if (!supabaseConfigured) return;

    setLoading(true);

    try {

        const { error } =
            await supabaseClient
                .from("users")
                .delete()
                .eq("id", userId);

        if (error) throw error;

        await loadData();

        showToast("Usunięto osobę");

    } catch (error) {

        console.error(error);

        showError(
            "Nie udało się usunąć osoby."
        );

    } finally {

        setLoading(false);
    }
}

/* =========================================================
   FILTROWANIE
========================================================= */

function filterPerson(userId) {

    const user =
        users.find(u => u.id === userId);

    if (!user) return;

    showToast(
        `Kliknij dzień, aby edytować ${user.display_name}`
    );
}

/* =========================================================
   MODALE
========================================================= */

function closeModal(id) {

    document
        .getElementById(id)
        .classList.remove("show");
}

document
    .getElementById("addPersonBtn")
    .addEventListener("click", () => {

        document
            .getElementById("personModal")
            .classList.add("show");

        setTimeout(() => {
            document
                .getElementById("personName")
                .focus();
        }, 100);
    });

document
    .getElementById("savePersonBtn")
    .addEventListener(
        "click",
        addPerson
    );

document
    .getElementById("personName")
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                addPerson();
            }

        }
    );

document
    .getElementById("saveAvailabilityBtn")
    .addEventListener(
        "click",
        saveAvailability
    );

document
    .getElementById("clearAvailabilityBtn")
    .addEventListener(
        "click",
        clearAvailability
    );

/* =========================================================
   NAWIGACJA MIESIĄCAMI
========================================================= */

document
    .getElementById("prevMonth")
    .addEventListener("click", () => {

        currentMonth =
            new Date(
                currentMonth.getFullYear(),
                currentMonth.getMonth() - 1,
                1
            );

        render();
    });

document
    .getElementById("nextMonth")
    .addEventListener("click", () => {

        currentMonth =
            new Date(
                currentMonth.getFullYear(),
                currentMonth.getMonth() + 1,
                1
            );

        render();
    });

document
    .getElementById("todayBtn")
    .addEventListener("click", () => {

        const now = new Date();

        currentMonth =
            new Date(
                now.getFullYear(),
                now.getMonth(),
                1
            );

        render();
    });

/* =========================================================
   POMOCNICZE
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* =========================================================
   START
========================================================= */

function hideLoading() {
    document
        .getElementById("loading")
        .classList.add("hidden");
}

render();
loadData();
setupRealtime();

</script>
